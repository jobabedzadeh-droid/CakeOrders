name: Build

on:
  push:
    branches: [ main, feature/rahkaran-sales-request-outbox ]
  pull_request:
    branches: [ main, feature/workshop-review-workflow ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore CakeOrders.sln
      - name: Build
        run: dotnet build CakeOrders.sln --configuration Release --no-restore
